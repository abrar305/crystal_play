<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crystal Play</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0d1747;--bg2:#1d3fae;--yellow:#ffd23f;--ink:#10205a;--c:#ffd23f;--good:#22c55e;--bad:#ff5d73}
*{box-sizing:border-box}
html{background:var(--bg1)}
body{margin:0;min-height:100vh;font-family:'Baloo 2',system-ui,Arial,sans-serif;color:#fff;background:linear-gradient(180deg,var(--bg1) 0,var(--bg2) 100%) fixed;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
h1,h2,h3,.fun{font-family:'Lilita One',system-ui,Arial,sans-serif;font-weight:400;letter-spacing:.01em}
a{color:inherit;text-decoration:none} button{font:inherit;cursor:pointer}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0}
#sky i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s infinite alternate}
@keyframes tw{from{opacity:.15;transform:scale(.7)}to{opacity:1;transform:scale(1.3)}}
header,main{position:relative;z-index:1}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;max-width:680px;margin:0 auto}
#back{width:44px;height:44px;border-radius:14px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:22px}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto} .brand img{height:40px} .brand b{font:400 22px 'Lilita One',system-ui,Arial,sans-serif;color:var(--yellow)}
.ingame .brand b{display:none}
.chip{background:rgba(255,255,255,.14);border-radius:999px;padding:6px 13px;font-weight:800;font-size:18px;white-space:nowrap}
#mute{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);font-size:20px}
main{max-width:680px;margin:0 auto;padding:8px 16px 50px}
.b3d{display:block;text-align:center;border:0;border-radius:20px;padding:14px 26px;background:var(--c);color:var(--ink);font:400 24px 'Lilita One',system-ui,Arial,sans-serif;box-shadow:0 7px 0 rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s}
.b3d:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.b3d.white{background:#fff} .b3d.dim{background:rgba(255,255,255,.16);color:#fff}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
/* home */
.hero{text-align:center;padding:10px 0 4px} .hero h1{margin:0;font-size:clamp(34px,9vw,52px);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.25)} .hero p{margin:4px 0 0;font-size:19px;opacity:.9}
.world{display:flex;align-items:center;gap:14px;background:#fff;color:var(--ink);border-radius:26px;padding:12px;margin:18px 0;border-bottom:8px solid var(--c);box-shadow:0 10px 24px rgba(0,0,0,.25);transition:transform .15s}
.world:hover{transform:translateY(-3px)}
.world img{width:92px;border-radius:16px;flex:none;box-shadow:0 5px 12px rgba(0,0,0,.25)}
.winfo{flex:1;min-width:0} .winfo h3{margin:0;font-size:30px;line-height:1} .winfo small{font-weight:800;color:#5b6a99}
.prog{height:10px;background:#e3e9ff;border-radius:6px;overflow:hidden;margin:7px 0 3px} .prog i{display:block;height:100%;background:var(--c);border-radius:6px}
.go{background:var(--c);color:var(--ink);border-radius:16px;padding:10px 16px;font:400 22px 'Lilita One',system-ui,Arial,sans-serif;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.wstars{font-size:22px;letter-spacing:2px}
/* map */
.mhead{display:flex;align-items:center;gap:14px;margin:6px 0 14px} .mhead img{width:78px;border-radius:14px;border:4px solid var(--c);box-shadow:0 6px 16px rgba(0,0,0,.3)} .mhead h2{margin:0;font-size:38px;line-height:1}
.sect{font:400 24px 'Lilita One',system-ui,Arial,sans-serif;color:var(--yellow);margin:20px 0 4px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.path{position:relative}
.node{display:flex;align-items:center;gap:12px;background:#fff;color:var(--ink);border-radius:22px;padding:10px 14px 10px 10px;margin:12px 0;box-shadow:0 6px 0 rgba(0,0,0,.22);position:relative}
.node:not(:last-child)::after{content:"";position:absolute;left:41px;top:100%;width:0;height:12px;border-left:5px dotted rgba(255,255,255,.45)}
.nb{width:56px;height:56px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;font:400 28px 'Lilita One',system-ui,Arial,sans-serif;flex:none;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.nt{flex:1;min-width:0} .nt b{display:block;font:400 22px 'Lilita One',system-ui,Arial,sans-serif;line-height:1.1} .nt small{display:block;font-weight:700;color:#5b6a99;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ns{font-size:18px;letter-spacing:1px;white-space:nowrap}
.node.rev .nb{background:#c084fc;color:#fff;border-radius:16px} .node.locked{opacity:.55;filter:grayscale(.6)} .node.locked .nb{background:#cbd5e1}
.node.nope{animation:shake .4s}
/* stage page */
.stg{text-align:center} .stg h2{font-size:40px;margin:6px 0} .stg p{margin:0 0 12px;opacity:.92;font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 20px}
.chip2{background:rgba(255,255,255,.14);border-radius:16px;padding:8px 12px;text-align:center;min-width:92px}
.chip2 b{display:block;font:400 28px 'Lilita One',system-ui,Arial,sans-serif;color:var(--yellow)} .chip2 span{font-weight:700;font-size:14px;opacity:.95}
/* game */
#dots{display:flex;gap:5px;justify-content:center;margin:6px 0 10px}
#dots i{flex:1;max-width:34px;height:12px;border-radius:7px;background:rgba(255,255,255,.2);transition:background .3s}
#dots i.cur{background:#fff;animation:pulse 1s infinite alternate} #dots i.ok{background:var(--good)} #dots i.retry{background:var(--yellow)}
@keyframes pulse{to{transform:scaleY(1.5)}}
.mrow{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-height:66px}
#mascot{width:62px;height:62px;object-fit:contain;animation:float 2.2s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
#mascot.happy{animation:jump .6s} #mascot.sad{animation:wobble .5s}
#bubble{background:#fff;color:var(--ink);border-radius:18px 18px 18px 4px;padding:6px 14px;font:400 20px 'Lilita One',system-ui,Arial,sans-serif;box-shadow:0 4px 0 rgba(0,0,0,.2)}
#bubble:empty{display:none}
@keyframes float{50%{transform:translateY(-6px)}} @keyframes jump{30%{transform:translateY(-22px) rotate(-10deg) scale(1.15)}60%{transform:translateY(0)}80%{transform:translateY(-8px)}}
@keyframes wobble{25%{transform:rotate(-14deg)}50%{transform:rotate(12deg)}75%{transform:rotate(-8deg)}}
.qcard{background:#fff;color:var(--ink);border-radius:28px;padding:16px 14px 18px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.22)}
.q{font:400 clamp(24px,6vw,32px) 'Lilita One',system-ui,Arial,sans-serif;margin:0 0 8px}
.pic{display:inline-flex;align-items:center;justify-content:center;width:min(230px,62vw);height:min(230px,62vw);position:relative;background:#eef4ff;border-radius:22px;padding:10px}
.pic img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
.say{position:absolute;right:-8px;bottom:-8px;width:52px;height:52px;border-radius:50%;border:0;background:var(--c);color:var(--ink);font-size:24px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.letterbig{font:400 clamp(66px,21vw,100px)/1.05 'Lilita One',system-ui,Arial,sans-serif;color:var(--ink);background:#eef4ff;border-radius:22px;display:inline-block;padding:2px 34px 8px}
.blankword{font:400 clamp(46px,15vw,72px)/1 'Lilita One',system-ui,Arial,sans-serif;letter-spacing:.05em;color:var(--ink);margin:10px 0 0} .blankword u{color:var(--bad);text-decoration-thickness:6px}
.listen{width:130px;height:130px;border-radius:50%;border:0;background:var(--c);color:var(--ink);font-size:58px;box-shadow:0 8px 0 rgba(0,0,0,.25);animation:pulse2 1.4s infinite}
@keyframes pulse2{50%{transform:scale(1.07)}}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 6px} .opts.col1{grid-template-columns:1fr}
.opt{border:0;border-radius:22px;min-height:112px;padding:8px;display:flex;align-items:center;justify-content:center;font:400 clamp(46px,14vw,68px) 'Lilita One',system-ui,Arial,sans-serif;color:var(--ink);box-shadow:0 8px 0 rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s,opacity .2s;position:relative}
.opt.txt{min-height:74px;font-size:clamp(28px,8vw,38px)}
.opt:active:not(:disabled){transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.opt img{max-width:100%;max-height:96px;object-fit:contain;background:rgba(255,255,255,.65);border-radius:14px;padding:4px}
.opt.c0{background:#ff7a8a}.opt.c1{background:#5ad1f5}.opt.c2{background:#ffd23f}.opt.c3{background:#7ae582}
.opt.right{background:#22c55e;color:#fff;animation:pop .5s;box-shadow:0 0 0 5px #fff,0 8px 0 rgba(0,0,0,.28)}
.opt.right::after{content:"✔";position:absolute;top:-8px;right:-4px;background:#fff;color:#16a34a;border-radius:50%;width:32px;height:32px;font:900 20px/32px sans-serif}
.opt.wrong{opacity:.4;animation:shake .4s;filter:grayscale(.5)} .opt:disabled{cursor:default}
.msg{min-height:44px;font:400 clamp(26px,7vw,34px) 'Lilita One',system-ui,Arial,sans-serif;margin:10px 0 2px;text-align:center;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.msg.good{color:#86efac}.msg.bad{color:#ffb4bd}
.reveal{text-align:center;font:800 22px 'Baloo 2',system-ui,Arial,sans-serif;min-height:32px;opacity:.95} .reveal b{color:var(--yellow);font-size:28px}
#next{margin:12px auto 0;max-width:260px}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.16)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px} .mgrid.g3{grid-template-columns:repeat(3,1fr)}
.mc{border:0;border-radius:18px;min-height:86px;background:#5ad1f5;color:var(--ink);font:400 clamp(38px,12vw,54px) 'Lilita One',system-ui,Arial,sans-serif;box-shadow:0 6px 0 rgba(0,0,0,.25);padding:6px;display:flex;align-items:center;justify-content:center}
.mc.txt{font-size:clamp(20px,6vw,28px);line-height:1.1;word-break:break-word} .mc img{max-width:100%;max-height:78px;object-fit:contain;border-radius:10px}
.mc.up{background:#ff7a8a}.mc.sel{background:#fff;outline:4px solid var(--yellow)}.mc.done{background:#22c55e;color:#fff;animation:pop .4s;pointer-events:none}.mc.no{animation:shake .4s}
.conf{position:fixed;top:-20px;width:11px;height:15px;border-radius:2px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(600deg)}}
#combo{position:fixed;left:50%;top:36%;transform:translate(-50%,0) scale(.3);z-index:40;font:400 clamp(36px,10vw,60px) 'Lilita One',system-ui,Arial,sans-serif;color:#fff;text-shadow:0 5px 0 #ff7a00,0 0 24px #ffd23f;opacity:0;pointer-events:none;white-space:nowrap}
#combo.on{animation:combo 1.1s ease-out}
@keyframes combo{0%{opacity:0;transform:translate(-50%,0) scale(.3)}25%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}70%{opacity:1;transform:translate(-50%,-20px) scale(1)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
.flash{position:fixed;inset:0;z-index:25;pointer-events:none;background:radial-gradient(circle,rgba(34,197,94,.45),transparent 70%);animation:fl .5s forwards}
@keyframes fl{from{opacity:1}to{opacity:0}}
.res{text-align:center;padding-top:10px} .trophy{font-size:96px;animation:float 1.6s ease-in-out infinite} .res h2{font-size:44px;margin:0}
.bigstars{font-size:clamp(50px,14vw,76px);letter-spacing:6px;margin:6px 0} .bigstars span{display:inline-block;animation:pop .7s both} .bigstars .off{filter:grayscale(1);opacity:.3}
.stats{display:flex;gap:10px;justify-content:center;margin:10px 0 18px;flex-wrap:wrap}
.check li{list-style:none;background:rgba(255,255,255,.1);border-radius:12px;padding:6px 12px;margin:5px 0;font-weight:700;word-break:break-all;font-size:15px}
.check h3{margin:18px 0 4px;font-size:24px;color:var(--yellow)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.conf{display:none}}
[hidden]{display:none!important}

/* Smooth screen entrance */
main:not([hidden]) {
  animation: screenEnter .45s ease both;
}

@keyframes screenEnter {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* World cards */
.world {
  animation: cardEnter .55s ease both;
  transition: transform .25s ease, box-shadow .25s ease;
}

.world:nth-child(2) { animation-delay: .1s; }
.world:nth-child(3) { animation-delay: .2s; }
.world:nth-child(4) { animation-delay: .3s; }

.world:hover {
  transform: translateY(-6px) scale(1.02);
  box-shadow: 0 15px 28px rgba(0,0,0,.3);
}

.world img {
  transition: transform .3s ease;
}

.world:hover img {
  transform: rotate(-5deg) scale(1.07);
}

@keyframes cardEnter {
  from {
    opacity: 0;
    transform: translateY(25px) scale(.96);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* Learning stages */
.node {
  animation: nodeEnter .4s ease both;
  transition: transform .2s ease, box-shadow .2s ease;
}

.node:nth-child(2) { animation-delay: .05s; }
.node:nth-child(3) { animation-delay: .1s; }
.node:nth-child(4) { animation-delay: .15s; }
.node:nth-child(5) { animation-delay: .2s; }
.node:nth-child(6) { animation-delay: .25s; }

.node:not(.locked):hover {
  transform: translateX(6px);
  box-shadow: 0 9px 0 rgba(0,0,0,.22);
}

@keyframes nodeEnter {
  from {
    opacity: 0;
    transform: translateX(-20px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

/* Quiz options */
.opt {
  transition: transform .2s ease, box-shadow .2s ease;
}

@media (hover: hover) {
  .opt:not(:disabled):hover {
    transform: translateY(-5px) scale(1.04);
    box-shadow: 0 12px 0 rgba(0,0,0,.22);
  }

  .mc:hover {
    transform: translateY(-4px) scale(1.03);
  }
}

.mc {
  transition: transform .2s ease;
}

.pic {
  animation: picturePop .5s ease both;
}

@keyframes picturePop {
  from {
    opacity: 0;
    transform: scale(.85);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* Rewards animation */
.bigstars span {
  animation: starBounce .7s ease both;
}

.bigstars span:nth-child(2) {
  animation-delay: .2s;
}

.bigstars span:nth-child(3) {
  animation-delay: .4s;
}

@keyframes starBounce {
  0% {
    opacity: 0;
    transform: scale(0) rotate(-30deg);
  }
  65% {
    opacity: 1;
    transform: scale(1.3) rotate(15deg);
  }
  100% {
    transform: scale(1) rotate(0);
  }
}

.trophy {
  animation: trophyMove 2s ease-in-out infinite;
}

@keyframes trophyMove {
  0%, 100% { transform: translateY(0) rotate(-4deg); }
  50% { transform: translateY(-12px) rotate(4deg); }
}

</style>
</head>
<body>
<div id="sky"></div>
<header>
  <button id="back" aria-label="Back" hidden>←</button>
  <a class="brand" href="#"><img src="assets/logo.png" alt="Crystal"><b>Crystal Play</b></a>
  <span class="chip" id="streak" hidden>🔥 0</span><span class="chip" id="gems">💎 0</span>
  <button id="mute" aria-label="Sound on">🔊</button>
</header>
<div id="combo" aria-hidden="true"></div>

<main id="home"><div class="hero"><h1>Choose your world!</h1><p>Finish stages, collect 💎 and win stars</p></div><div id="worlds"></div></main>
<main id="map" hidden></main>
<main id="stage" hidden></main>
<main id="game" hidden>
  <div id="dots"></div>
  <div class="mrow"><img id="mascot" src="assets/logo.png" alt=""><div id="bubble"></div></div>
  <div id="qarea"></div>
</main>
<main id="result" hidden><div class="res">
  <div class="trophy">🏆</div><h2 id="rtitle"></h2><div class="bigstars" id="rstars" aria-label="Your stars"></div>
  <div class="stats"><span class="chip" id="rgems"></span><span class="chip" id="rscore"></span><span class="chip" id="rstreak"></span></div>
  <a class="b3d" id="rnext" href="#" style="max-width:300px;margin:0 auto 14px" hidden>Next ▶</a>
  <a class="b3d white" id="again" href="#" style="max-width:300px;margin:0 auto 14px">Play again 🔁</a>
  <a class="b3d dim" id="rmap" href="#" style="max-width:300px;margin:0 auto">Back to the map</a>
</div></main>
<main id="check" hidden>
  <h2 class="fun" style="font-size:34px;margin:6px 0">File checker</h2>
  <p id="chk-sum" style="opacity:.95;margin:0 0 6px">Checking...</p><div class="check" id="chk-out"></div>
</main>

<script src="data.js"></script>
<script>
const $ = id => document.getElementById(id);
const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const ALPHA = "abcdefghijklmnopqrstuvwxyz".split(""), DIGS = ["ai","ee","oa","ie","oo","ou","oi","sh","ch","th","ar","or","er","ue","ng","qu"];
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
const slug = w => w.toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const lab = w => (WORDS[w] && WORDS[w].label) || w;
const wImg = w => (WORDS[w] && WORDS[w].img) || "assets/words/" + slug(w) + ".jpg";
const wClip = w => ({ file: (WORDS[w] && WORDS[w].audio) || "audio/words/" + slug(w) + ".mp3", say: lab(w) });
const eq = g => (g === "c" || g === "k") ? ["c","k"] : [g];                 // c and k make the same sound
const sg = g => (g === "c" || g === "k") ? "k" : g;
const has = (word, gs) => gs.some(g => eq(g).some(e => word.includes(e)));
const isL = g => g.length === 1;
const gShow = g => isL(g) ? g.toUpperCase() + g : g;

/* items of sound stages come as [word, grapheme] pairs: make them objects */
Object.values(LEVELS).forEach(L => L.nodes.forEach(n => { if(n.kind === "sounds") n.items = n.items.map(it => ({ ...it, words: it.words.map(([w,g]) => ({ w, g })) })); }));

(function(){ const s = $("sky"); for(let i=0;i<46;i++){ const e = document.createElement("i"); e.style.left = Math.random()*100+"%"; e.style.top = Math.random()*100+"%"; e.style.animationDelay = Math.random()*3+"s"; s.appendChild(e); } })();

/* missing pictures show a grey card with the word (so the game never breaks while you add pictures) */
function ph(t){ t = (t || "?").replace(/[<>&"']/g, ""); return "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><rect width='300' height='300' rx='28' fill='#e8edf8'/><text x='150' y='140' font-size='72' text-anchor='middle'>🖼️</text><text x='150' y='205' font-size='28' font-family='Arial' font-weight='bold' text-anchor='middle' fill='#6b7aa8'>${t}</text></svg>`); }
const EXTS = [".jpg", ".jpeg", ".png", ".webp"];     // the game accepts any of these for a picture (same name)
document.addEventListener("error", e => { const el = e.target; if(!el || el.tagName !== "IMG" || el.dataset.ph || el.classList.contains("cover")) return;
  const m = (el.getAttribute("src") || "").match(/^(assets\/words\/.+?)(\.[a-z]+)$/i);
  if(m){ const list = EXTS.filter(x => x !== m[2].toLowerCase()), t = +(el.dataset.t || 0); if(t < list.length){ el.dataset.t = t + 1; el.src = m[1] + list[t]; return; } }
  el.dataset.ph = "1"; el.src = ph(el.alt); }, true);

/* ---------- sound effects & voice ---------- */
let muted = store.get("cp-muted") === "1", AC;
function tone(f, d=.15, type="sine", vol=.2, delay=0){ if(muted) return;
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + delay;
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.05); }catch(e){} }

function ctxFor(L, idx){

}

/* ---------- file checker (#check) ---------- */
function probeOne(kind, url){ return new Promise(res => { let done = false; const end = v => { if(!done){ done = true; res(v); } }; setTimeout(() => end(false), 6000);
  if(kind === "img"){ const i = new Image(); i.onload = () => end(true); i.onerror = () => end(false); i.src = url; }
  else { const a = new Audio(); a.preload = "metadata"; a.onloadedmetadata = () => end(true); a.onerror = () => end(false); a.src = url; } }); }
async function probe(kind, url){
  if(kind !== "img") return probeOne(kind, url);
  const base = url.replace(/\.[a-z]+$/i, ""); for(const x of EXTS){ if(await probeOne("img", base + x)) return true; } return false; }
async function showCheck(){
  show("check"); const jobs = [];
  Object.entries(WORDS).forEach(([w,v]) => { jobs.push({ g:"Pictures", kind:"img", url:v.img, name:lab(w) }); jobs.push({ g:"Word recordings", kind:"aud", url:v.audio, name:lab(w) }); });
  Object.entries(SOUNDS).forEach(([id,v]) => jobs.push({ g:"Letter sounds", kind:"aud", url:v.file, name:id }));
  const stat = {}, miss = {}; jobs.forEach(j => { stat[j.g] = stat[j.g] || { ok:0, n:0 }; stat[j.g].n++; miss[j.g] = miss[j.g] || []; });
  const paint = fin => { $("chk-sum").innerHTML = Object.entries(stat).map(([g,s]) => `${g}: <b>${s.ok}</b> of ${s.n}`).join(" &nbsp;|&nbsp; ") + (fin ? "" : " — checking...");
    $("chk-out").innerHTML = Object.entries(miss).map(([g,l]) => `<h3>${g} — missing ${l.length}</h3><ul style="padding:0">${l.map(x => `<li>❌ ${x.kind === "img" ? x.url.replace(/\.[a-z]+$/i, ".jpg (or .png / .jpeg / .webp)") : x.url} <small>(${x.name})</small></li>`).join("")}</ul>`).join(""); };
  let i = 0; const worker = async () => { while(i < jobs.length){ const j = jobs[i++], ok = await probe(j.kind, j.url); if(ok) stat[j.g].ok++; else miss[j.g].push(j); } };
  await Promise.all(Array.from({ length:24 }, worker)); paint(true);
}

function route(){
  const [k, a, b] = location.hash.replace("#","").split("/"); if(window.speechSynthesis) speechSynthesis.cancel();
  if(k === "check") return showCheck();
  if(LEVELS[k]){ const i = a ? +a - 1 : -1;
    if(i >= 0 && b === "play") return startGame(k, i);
    if(i >= 0) return showStage(k, i);
    return showMap(k); }
  setColor(null); renderHome(); show("home"); backFn = null; document.title = "Crystal Play";
}
window.addEventListener("hashchange", route); route();
</script>
